<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Découpeur GitHub Ready 24.5 Mo</title>
    <style>/* mêmes styles */</style>
</head>
<body>
    <div class="container">
        <h1>🔪 Découpeur compatible GitHub (≤24.5 Mo/partie)</h1>
        <p>Chaque fichier texte fait <strong>strictement moins de 25 Mo</strong> pour GitHub.</p>
        <!-- interface identique -->
    </div>

    <script>
        // 🔥 NOUVELLE TAILLE MAX : 24.5 Mo (marge pour GitHub)
        const TAILLE_MAX = 24.5 * 1024 * 1024; // 25 690 112 caractères max
        
        class FileCutter {
            constructor() { /* ... mêmes initialisations ... */ }

            async handleFile(file) {
                this.file = file;
                this.processBtn.disabled = false;
                
                // Message d'avertissement si le fichier est énorme
                const estimatedParts = Math.ceil(file.size / (TAILLE_MAX * 0.75)); // Approximation Base64
                this.uploadArea.textContent = `📄 ${file.name} (${this.formatSize(file.size)}) ~ ${estimatedParts} parties`;
            }

            // ✅ Découpe en parties de EXACTEMENT TAILLE_MAX caractères sauf dernière
            splitDataURL(dataUrl) {
                const parts = [];
                let pos = 0;
                const len = dataUrl.length;
                const chunkSize = Math.floor(TAILLE_MAX); // 24.5 Mo en caractères
                
                while (pos < len) {
                    const end = Math.min(pos + chunkSize, len);
                    parts.push(dataUrl.substring(pos, end));
                    pos = end;
                }
                return parts;
            }

            async processFile() {
                // ... (début identique)
                
                try {
                    // Étape 1: Data URL
                    this.progressText.textContent = 'Conversion en Data URL...';
                    const dataUrl = await this.fileToDataURL(this.file);
                    
                    // Étape 2: Découpage en parties ≤ 24.5 Mo
                    this.progressText.textContent = 'Découpage...';
                    const parts = this.splitDataURL(dataUrl);
                    
                    // ✅ Vérification : taille de chaque partie < 25 Mo
                    for (let i = 0; i < parts.length; i++) {
                        const sizeInMB = parts[i].length / (1024 * 1024);
                        if (parts[i].length >= 25 * 1024 * 1024) {
                            throw new Error(`Partie ${i+1} trop grosse (${sizeInMB.toFixed(2)} Mo) !`);
                        }
                    }
                    
                    // Étape 3: Téléchargement
                    for (let i = 0; i < parts.length; i++) {
                        await this.downloadPart(parts[i], i, parts.length);
                    }
                    
                    // Statistiques
                    this.stats.innerHTML = `
                        <strong>✅ Compatible GitHub :</strong><br>
                        Fichier : ${this.file.name}<br>
                        Parties : ${parts.length}<br>
                        Taille max par fichier : 24.5 Mo<br>
                        Taille réelle max : ${(Math.max(...parts.map(p => p.length)) / 1024 / 1024).toFixed(2)} Mo
                    `;
                    
                } catch (error) {
                    this.error.textContent = `❌ ${error.message}`;
                }
            }

            // Même downloadPart()
        }

        new FileCutter();
    </script>
</body>
</html>
